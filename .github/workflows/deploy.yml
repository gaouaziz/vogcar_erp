name: CI/CD ERP Deployment

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Prépare les permissions sur le serveur pour éviter les erreurs de droits avec Docker/SCP
      - name: Prepare permissions on OCI Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/vogcar-erp
            sudo chown -R ubuntu:ubuntu /home/ubuntu/vogcar-erp

      # Copie les fichiers dans le dossier vogcar-erp
      - name: Copy files via SCP to OCI Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          source: "backend/,frontend/,docker-compose.yml"
          target: "/home/ubuntu/vogcar-erp"

      # Exécute Docker dans le dossier vogcar-erp
      - name: Deploy to OCI Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/vogcar-erp

            if [ "${{ github.ref_name }}" = "main" ]; then
              if [ ! -f .env.production ]; then
                echo "ERREUR: .env.production est manquant dans /home/ubuntu/vogcar-erp !"
                exit 1
              fi
              echo "Déploiement PRODUCTION (Frontend: 8082, Backend: 5002)..."
              docker compose --env-file .env.production up -d --build
            else
              if [ ! -f .env.development ]; then
                echo "ERREUR: .env.development est manquant dans /home/ubuntu/vogcar-erp !"
                exit 1
              fi
              echo "Déploiement DEVELOPMENT (Frontend: 8081, Backend: 5001)..."
              docker compose --env-file .env.development up -d --build
            fi

            docker image prune -f
