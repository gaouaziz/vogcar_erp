name: CI/CD ERP Deployment

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Copie les fichiers dans le dossier vogcar-erp
      - name: Copy files via SCP to OCI Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          source: "backend/,frontend/,docker-compose.yml"
          target: "/home/ubuntu/vogcar-erp" # <-- Mis à jour ici

      # Exécute Docker dans le dossier vogcar-erp
      - name: Deploy to OCI Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/vogcar-erp # <-- Mis à jour ici
            
            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "Déploiement PRODUCTION sur le port 8082..."
              docker compose --env-file .env.production up -d --build
            else
              echo "Déploiement DEVELOPMENT sur le port 8081..."
              docker compose --env-file .env.development up -d --build
            fi
            
            docker image prune -f
